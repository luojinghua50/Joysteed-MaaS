name: maas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maas}
      POSTGRES_USER: ${POSTGRES_USER:-maas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maas_password}
    volumes:
      - maas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - maas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  maas-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    environment:
      MAAS_HTTP_ADDR: ":8080"
      MAAS_DATABASE_URL: "host=postgres port=5432 user=${POSTGRES_USER:-maas} password=${POSTGRES_PASSWORD:-maas_password} dbname=${POSTGRES_DB:-maas} sslmode=disable"
      MAAS_REDIS_ADDR: "redis:6379"
      MAAS_ADMIN_USERNAME: ${MAAS_ADMIN_USERNAME:-admin}
      MAAS_ADMIN_PASSWORD: ${MAAS_ADMIN_PASSWORD:-change-me}
      MAAS_CORS_ORIGIN: ${MAAS_CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${MAAS_BIND_HOST:-127.0.0.1}:${MAAS_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "/maas-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  maas-ui:
    build:
      context: ./maas-ui
    depends_on:
      maas-api:
        condition: service_healthy
    ports:
      - "${MAAS_BIND_HOST:-127.0.0.1}:${MAAS_UI_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  maas_postgres_data:
  maas_redis_data:
